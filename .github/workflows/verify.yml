name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm --prefix frontend ci
      - name: Start dedicated analytics fixture MongoDB
        run: |
          docker run -d --name phase9-ci-mongo -p 127.0.0.1:27029:27029 mongo:7.0 sh -c 'mkdir -p /scratch/phase9-mongo-1 && exec mongod --port 27029 --bind_ip_all --dbpath /scratch/phase9-mongo-1'
          for attempt in $(seq 1 30); do
            if docker exec phase9-ci-mongo mongosh --port 27029 --quiet --eval 'quit(db.adminCommand("ping").ok ? 0 : 1)'; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npm test
        env:
          PHASE9_TEST_MONGO_URI: mongodb://127.0.0.1:27029
      - run: npm run frontend:test
      - run: npm run frontend:typecheck
      - run: npm run frontend:build
      - run: npm audit --audit-level=high
      - run: npm --prefix frontend audit --audit-level=high
      - run: node scripts/secret-check.js
      - run: node scripts/prepare-staging.js
      - run: docker compose --env-file .env.staging.local -f deploy/compose.yml config --quiet
      - run: docker build -f deploy/Dockerfile -t sensorguard-ci:local .
